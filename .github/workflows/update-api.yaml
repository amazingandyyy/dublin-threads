name: generate api data from archives

on:
  workflow_run:
    workflows: ["snapshot and generate JSON (developments)"]
    types:
      - completed
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes
  workflow_dispatch:

jobs:
  update-api:
    permissions:
      contents: write
    name: update api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: use node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: set timezone to America/Los_Angeles
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "America/Los_Angeles"
          timezoneMacos: "America/Los_Angeles"
      - name: list files
        run: tree -L 3 .

      - name: install node dependencies
        working-directory: ./worker
        run: npm ci

      - name: take a snapshot&json
        working-directory: ./worker/developments
        run: node pipelines/generate-api.js

      - name: check for modified files
        id: git-check
        run: echo ::set-output name=modified::$(if [ -n "$(git status --porcelain)" ]; then echo "true"; else echo "false"; fi)

      - name: commit
        if: steps.git-check.outputs.modified == 'true'
        run:  |
          current=$(date)
          git config --global user.name 'dublin-threads-bot'
          git config --global user.email 'dublin-threads@amazingandyyy.com'
          git status
          git add -A
          echo $current
          git commit -m 'feat(data): update api' -m "$current"
          # These workflows share a cron and all commit to main, so pushes race.
          # Rebase onto whatever landed first and retry before giving up.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "push failed after 5 attempts"
          exit 1
  